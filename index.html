<style>:root{--bg:#0B0B0C;--card:#2A2A2A;--card2:#3A3A3A;--line:rgba(255,255,255,.07);--fg:#FAFAF7;--fg2:#CFCFCB;--mute:#8A8A8A;--dim:#4A4A4A;--acc:#FFF351;--dn:#E2695F;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--gut:max(20px,calc(var(--sal) + 16px));--tabh:60px;color-scheme:dark;}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}body{font-family:'Hanken Grotesk',system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;color:var(--fg);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none}button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-appearance:none;appearance:none}button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}#app{position:fixed;inset:0;display:flex;flex-direction:column}#scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scrollbar-width:none;padding-top:var(--sat);padding-left:var(--sal);padding-right:var(--sar)}#scroll::-webkit-scrollbar{display:none}#scrim{position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--bg);z-index:6;pointer-events:none}.px{padding-left:var(--gut);padding-right:var(--gut)}.screen{padding-bottom:32px;animation:fadeIn .18s ease-out}.row{display:flex;align-items:center}.between{display:flex;justify-content:space-between;align-items:center}.baseline{display:flex;justify-content:space-between;align-items:baseline}.h2{font-size:20px;font-weight:700;letter-spacing:-.3px}.sub{font-size:13px;color:var(--mute)}.card{background:var(--card);border-radius:18px}.iconbtn{width:44px;height:44px;border-radius:22px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap alc(var(--sar) + 6px) calc(var(--sab) + 6px) calc(var(--sal) + 6px);min-height:calc(var(--tabh) + var(--sab))}#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;font-size:11px;font-weight:500;color:var(--mute);padding-top:2px;min-height:48px}#tabs button[aria-current=page]{color:var(--fg);font-weight:600}.ti{width:22px;height:22px;display:flex;align-items:center;justify-content:center}#backdrop{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.66);opacity:0;pointer-events:none;transition:opacity .22s ease-out}#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:28px 28px 0 0;padding:10px calc(var(--sar) + 22px) calc(var(--sab) + 16px) calc(var(--sal) + 22px);max-height:calc(100% - var(--sat) - 24px);overflow-y:auto;overscroll-behavior:contain;transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s linear .3s;max-width:640px;margin:0 auto}body.sheet-open #backdrop{opacity:1;pointer-events:auto}body.sheet-open #sheet{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s}.grab{width:38px;height:5px;border-radius:3px;background:var(--dim);margin:0 auto}.radio{width:22px;height:22px;border-radius:11px;border:2px solid var(--dim);display:flex;align-items:center;justify-content:center}.radio.on{border-color:var(--fg);background:var(--fg)}.radio.on::after{content:"";width:8px;height:8px;border-radius:4px;background:#0A0A0A}.chip{display:flex;gap:6px;font-size:14px;font-weight:500;padding:11px 14px;border-radius:999px;color:var(--fg2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}.chip[aria-pressed=true]{background:var(--fg);color:#0A0A0A;font-weight:700;box-shadow:none}.cta{width:100%;margin-top:24px;height:56px;border-radius:18px;background:var(--acc);color:#0A0A0A;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800}.cta:active{transform:scale(.
